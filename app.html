  .whatsapp-btn {

    padding: 11px;

const DIAS = ["dom","lun","mar","mié","jue","vie","sáb"];

function pad(n){ return String(n).padStart(2,"0"); }
function monthKey(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}`; }
function todayISO(){
  const d = new Date();
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}
function fmtEUR(n){
  return new Intl.NumberFormat('es-ES', {style:'currency', currency:'EUR'}).format(n || 0);

function num(v){
  if (v === "" || v === null || v === undefined) return 0;

}
function sumTickets(tickets){
  return tickets.reduce((acc, t) => {
    acc.efectivo += Number(t.efectivo || 0);

  }, { efectivo: 0, tarjeta: 0, otro: 0, base4: 0, base10: 0, base21: 0 });
}
function lastDayOfMonth(y, m){

}

// --- OCR parsing helpers -------------------------------------------------
const NUM_RE = /\d{1,3}(?:[.,]\d{3})*[.,]\d{2}/g;
function toNumber(c){
  let v = c;
  if (v.includes(',') && v.includes('.')) v = v.replace(/\./g, '').replace(',', '.');
  else if (v.includes(',')) v = v.replace(',', '.');
  return parseFloat(v);
}
function firstNumberOnLine(line){
  const m = line.match(NUM_RE);
  if (!m) return null;
  const n = toNumber(m[m.length - 1]);
  return isNaN(n) ? null : n;
}
function leadingNumberOnLine(line){
  const m = line.match(NUM_RE);
  if (!m) return null;
  const n = toNumber(m[0]);
  return isNaN(n) ? null : n;
}
function extractFields(text){
  const lines = text.split('\n');
  const result = { efectivo: null, tarjeta: null, otro: null, base4: null, base10: null, base21: null, total: null };
  const noise = /subtotal|cambio|entreg|devuel/i;

  function findNearbyNumber(startIdx){
    for (let i = startIdx; i <= startIdx + 2 && i < lines.length; i++) {
      const n = firstNumberOnLine(lines[i]);
      if (n !== null) return n;
    }
    return null;
  }

  for (let idx = 0; idx < lines.length; idx++) {
    const line = lines[idx];
    if (result.efectivo === null && /efectivo/i.test(line) && !noise.test(line)) {
      const n = findNearbyNumber(idx);
      if (n !== null) result.efectivo = n;
    }
    if (result.tarjeta === null && /(tarjeta|visa|master|d[eé]bito|cr[eé]dito|tpv)/i.test(line)) {
      const n = findNearbyNumber(idx);
      if (n !== null) result.tarjeta = n;
    }
    if (result.otro === null && /(bizum|vale|cheque|transferencia)/i.test(line)) {
      const n = findNearbyNumber(idx);
      if (n !== null) result.otro = n;
    }
    if (result.base4 === null && /4\s?%/.test(line)) {
      const n = leadingNumberOnLine(line);
      if (n !== null) result.base4 = n;
    }
    if (result.base10 === null && /10\s?%/.test(line)) {
      const n = leadingNumberOnLine(line);
      if (n !== null) result.base10 = n;
    }
    if (result.base21 === null && /21\s?%/.test(line)) {
      const n = leadingNumberOnLine(line);
      if (n !== null) result.base21 = n;
    }
    if (result.total === null && /total/i.test(line) && !noise.test(line)) {
      const n = findNearbyNumber(idx);
      if (n !== null) result.total = n;
    }
  }
  return result;
}

// --- Auth screen -----------------------------------------------------------
function Auth(){
  const [mode, setMode] = useState('login');
  const [nombre, setNombre] = useState('');
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [showPass, setShowPass] = useState(false);
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState(null);
  const [info, setInfo] = useState(null);

  async function submit(e){
    e.preventDefault();
    setBusy(true); setErr(null); setInfo(null);
    try {
      if (mode === 'login') {
        const { error } = await sb.auth.signInWithPassword({ email, password });
        if (error) throw error;
      } else {
        const { error } = await sb.auth.signUp({
          email, password,
          options: { data: { nombre: nombre.trim() } }
        });
        if (error) throw error;
        setInfo('Cuenta creada. Si tu proyecto pide confirmación de email, revisa tu correo antes de entrar.');
      }
    } catch (e2) {
      setErr(e2.message || 'Error');
    } finally {
      setBusy(false);
    }
  }

  async function forgotPassword(){
    if (!email) { setErr('Escribe tu email arriba primero.'); return; }
    setBusy(true); setErr(null); setInfo(null);
    try {
      const { error } = await sb.auth.resetPasswordForEmail(email);
      if (error) throw error;
      setInfo('Te hemos enviado un email con un enlace para elegir una contraseña nueva.');
    } catch (e2) {
      setErr(e2.message || 'Error');
    } finally {
      setBusy(false);
    }
  }

  return (
    <div className="app-shell">
      <p className="eyebrow">Registro diario</p>
      <h1>Ventas del día</h1>
      <form className="entry-form" onSubmit={submit}>
        {mode === 'signup' && (
          <div className="form-row">
            <div className="field">
              <label htmlFor="a-nombre">Nombre del negocio</label>
              <input id="a-nombre" type="text" value={nombre} required
                     onChange={e => setNombre(e.target.value)} />
            </div>
          </div>
        )}
        <div className="form-row">
          <div className="field">
            <label htmlFor="a-email">Email</label>
            <input id="a-email" type="email" value={email} required
                   onChange={e => setEmail(e.target.value)} />
          </div>
        </div>
        <div className="form-row">
          <div className="field">
            <label htmlFor="a-pass">Contraseña</label>
            <div className="pass-wrap">
              <input id="a-pass" type={showPass ? "text" : "password"} value={password} required minLength={6}
                     onChange={e => setPassword(e.target.value)} />
              <button type="button" className="pass-toggle" onClick={() => setShowPass(s => !s)}>
                {showPass ? "OCULTAR" : "MOSTRAR"}
              </button>
            </div>
          </div>
        </div>
        {err && <p className="auth-error">{err}</p>}
        {info && <p className="auth-info">{info}</p>}
        <button className="btn-save" type="submit" disabled={busy}>
          {busy ? "..." : (mode === 'login' ? 'Entrar' : 'Crear cuenta')}
        </button>
      </form>
      <button type="button" className="iva-toggle"
              onClick={() => { setMode(m => m === 'login' ? 'signup' : 'login'); setErr(null); setInfo(null); }}>
        {mode === 'login' ? '¿No tienes cuenta todavía? Crear una' : '¿Ya tienes cuenta? Entrar'}
      </button>
      {mode === 'login' && (
        <button type="button" className="iva-toggle" style={{display:"block", marginTop:"4px"}}
                onClick={forgotPassword} disabled={busy}>
          He olvidado mi contraseña
        </button>
      )}
    </div>
  );
}

      <p style={{margin:"0 0 16px", fontSize:"14px", lineHeight:1.5, color:"var(--text-lo)"}}>
        Tu mes de prueba gratuita ha terminado.
        Elige un plan para seguir usándola:
      </p>

      <div className="summary-card" style={{marginBottom:"14px"}}>
        <div className="summary-total-label">Plan mensual</div>
        <div className="summary-total" style={{fontSize:"28px"}}>14,90€<span style={{fontSize:"14px", color:"var(--text-lo)"}}> /mes</span></div>
        <a href={monthlyUrl} target="_blank" rel="noopener noreferrer" className="btn-export"
           style={{display:"block", textAlign:"center", textDecoration:"none", position:"static", maxWidth:"none", marginTop:"10px"}}>
          Suscribirme al mes
        </a>
      </div>

      <div className="summary-card" style={{marginBottom:"14px"}}>
        <div style={{display:"inline-block", background:"var(--accent)", color:"#08130e", fontSize:"11px", fontWeight:800, padding:"4px 10px", borderRadius:"100px", marginBottom:"6px", fontFamily:"'JetBrains Mono', monospace", letterSpacing:"0.04em"}}>AHORRA MÁS</div>
        <div className="summary-total-label">Plan anual</div>
        <div className="summary-total" style={{fontSize:"28px"}}>9,50€<span style={{fontSize:"14px", color:"var(--text-lo)"}}> /mes</span></div>
        <p style={{margin:"2px 0 0", fontSize:"12px", color:"var(--text-lo)"}}>114€ facturados una vez al año</p>
        <a href={yearlyUrl} target="_blank" rel="noopener noreferrer" className="btn-export"
           style={{display:"block", textAlign:"center", textDecoration:"none", position:"static", maxWidth:"none", marginTop:"10px"}}>
          Suscribirme al año
        </a>
      </div>

      <button type="button" className="btn-scan" onClick={onRecheck} disabled={checking}>
        {checking ? "Comprobando…" : "Ya he pagado, comprobar de nuevo"}
      </button>
    </div>
  );
}

function App({ session }){
  const [cursor, setCursor] = useState(new Date());
  const [entries, setEntries] = useState(null); // {"01": [{id,efectivo,tarjeta,otro,base4,base10,base21}, ...]}
  const [loading, setLoading] = useState(true);
  const [dateVal, setDateVal] = useState(todayISO());
  const [efectivoVal, setEfectivoVal] = useState("");
  const [tarjetaVal, setTarjetaVal] = useState("");
  const [otroVal, setOtroVal] = useState("");
  const [ivaRate, setIvaRate] = useState('none'); // 'none' | '4' | '10' | '21'
  const [showIva, setShowIva] = useState(false);
  const [toast, setToast] = useState(null);
  const [saving, setSaving] = useState(false);
  const [exporting, setExporting] = useState(false);
  const [sendingEmail, setSendingEmail] = useState(false);
  const [scanning, setScanning] = useState(false);
  const [scanNote, setScanNote] = useState(null);
  const [gestoriaEmail, setGestoriaEmail] = useState("");
  const [gestoriaPhone, setGestoriaPhone] = useState("");
  const [gestoriaSaved, setGestoriaSaved] = useState(true);
  const [businessName, setBusinessName] = useState("");
  const [cif, setCif] = useState("");
  const businessNameRef = useRef("");
  const cifRef = useRef("");
  useEffect(() => { businessNameRef.current = businessName; }, [businessName]);
  useEffect(() => { cifRef.current = cif; }, [cif]);
  const fileInputRef = useRef(null);

  const [access, setAccess] = useState('checking'); // 'checking' | 'ok' | 'locked'
  const [accessChecking, setAccessChecking] = useState(false);

  const key = monthKey(cursor);

  const checkAccess = useCallback(async () => {
    setAccessChecking(true);
    try {
      const created = new Date(session.user.created_at);
      const trialEnd = new Date(created);
      trialEnd.setMonth(trialEnd.getMonth() + 1); // un mes real desde el registro, exportes o no
      const trialOver = new Date() >= trialEnd;

      if (!trialOver) { setAccess('ok'); return; }

      const { data: sub } = await sb
        .from('subscriptions')
        .select('status, current_period_end')
        .eq('user_id', session.user.id)
        .maybeSingle();

      const isActive = sub && sub.status === 'active' &&
        (!sub.current_period_end || new Date(sub.current_period_end) > new Date());

      setAccess(isActive ? 'ok' : 'locked');
    } catch (err) {
      // si falla la comprobación, no bloqueamos por error técnico
      setAccess('ok');
    } finally {
      setAccessChecking(false);
    }
  }, [session.user.id, session.user.created_at]);

  useEffect(() => { checkAccess(); }, [checkAccess]);

  useEffect(() => {
    (async () => {
      try {
        const { data } = await sb.from('settings').select('gestoria_email, gestoria_phone, business_name, cif').eq('user_id', session.user.id).maybeSingle();
        if (data && data.gestoria_email) setGestoriaEmail(data.gestoria_email);
        if (data && data.gestoria_phone) setGestoriaPhone(data.gestoria_phone);
        if (data && data.business_name) setBusinessName(data.business_name);
        if (data && data.cif) setCif(data.cif);
      } catch (err) { /* sin bloquear la app si esto falla */ }
    })();
  }, []);

  async function saveGestoriaEmail(){
    setGestoriaSaved(true);
    try {
      await sb.from('settings').upsert({ user_id: session.user.id, gestoria_email: gestoriaEmail.trim(), gestoria_phone: gestoriaPhone.trim(), business_name: businessName.trim(), cif: cif.trim(), updated_at: new Date().toISOString() });
    } catch (err) {
      showToast("No se pudo guardar el email de la gestoría");
    }
  }

  function showToast(msg){
    setToast(msg);
    setTimeout(() => setToast(null), msg && msg.length > 40 ? 5000 : 1800);
  }

  function activeRowsOnly(data){
    const voidedIds = new Set((data || []).filter(r => r.record_type === 'anulacion' && r.refs_id).map(r => r.refs_id));
    return (data || []).filter(r => r.record_type === 'alta' && !voidedIds.has(r.id));
  }

  async function fetchMonth(mkey){
    const [y, m] = mkey.split("-");
    const first = `${y}-${m}-01`;
    const last = `${y}-${m}-${pad(lastDayOfMonth(y, m))}`;
    const { data, error } = await sb
      .from('tickets')
      .select('*')
      .gte('fecha', first)
      .lte('fecha', last)
      .order('fecha', { ascending: true })
      .order('created_at', { ascending: true });
    if (error) throw error;
    const grouped = {};
    activeRowsOnly(data).forEach(row => {
      const day = String(row.fecha).slice(8, 10);
      if (!grouped[day]) grouped[day] = [];
      grouped[day].push({
        id: row.id,
        seq: row.seq_num,
        efectivo: Number(row.efectivo) || 0,
        tarjeta: Number(row.tarjeta) || 0,
        otro: Number(row.otro) || 0,
        base4: row.base4 === null || row.base4 === undefined ? null : Number(row.base4),
        base10: row.base10 === null || row.base10 === undefined ? null : Number(row.base10),
        base21: row.base21 === null || row.base21 === undefined ? null : Number(row.base21),
      });
    });
    return grouped;
  }

  async function fetchRange(first, last){
    const { data, error } = await sb
      .from('tickets')
      .select('*')
      .gte('fecha', first)
      .lte('fecha', last)
      .order('fecha', { ascending: true })
      .order('created_at', { ascending: true });
    if (error) throw error;
    const rowsByDate = {};
    activeRowsOnly(data).forEach(row => {
      const dateStr = String(row.fecha).slice(0, 10);
      if (!rowsByDate[dateStr]) rowsByDate[dateStr] = [];
      rowsByDate[dateStr].push({
        id: row.id,
        seq: row.seq_num,
        efectivo: Number(row.efectivo) || 0,
        tarjeta: Number(row.tarjeta) || 0,
        otro: Number(row.otro) || 0,
        base4: row.base4 === null || row.base4 === undefined ? null : Number(row.base4),
        base10: row.base10 === null || row.base10 === undefined ? null : Number(row.base10),
        base21: row.base21 === null || row.base21 === undefined ? null : Number(row.base21),
      });
    });
    // Anulados: tickets que se dieron de baja en este rango, con los datos del ticket original
    const byId = {};
    (data || []).forEach(r => { if (r.record_type === 'alta') byId[r.id] = r; });
    const voided = (data || [])
      .filter(r => r.record_type === 'anulacion' && r.refs_id && byId[r.refs_id])
      .map(r => {
        const orig = byId[r.refs_id];
        const tot = Number(orig.efectivo || 0) + Number(orig.tarjeta || 0) + Number(orig.otro || 0);
        return {
          seq: orig.seq_num,
          fecha: orig.fecha,
          total: Number(tot.toFixed(2)),
          fechaAnulacion: r.fecha,
        };
      });
    return { rowsByDate, voided };
  }

  function quarterKeyFromDate(d){
    return `${d.getFullYear()}-Q${Math.floor(d.getMonth() / 3) + 1}`;
  }
  function quarterInfo(qkey){
    const [yStr, qStr] = qkey.split("-Q");
    const y = Number(yStr), q = Number(qStr);
    const startMonth = (q - 1) * 3; // 0-indexed
    const endMonth = startMonth + 2;
    const first = `${y}-${pad(startMonth + 1)}-01`;
    const last = `${y}-${pad(endMonth + 1)}-${pad(lastDayOfMonth(y, pad(endMonth + 1)))}`;
    const label = `${MESES[startMonth].slice(0,3)}-${MESES[endMonth].slice(0,3)} ${y}`;
    return { year: y, q, first, last, label };
  }

  useEffect(() => {
    let cancelled = false;
    setLoading(true);
    fetchMonth(key)
      .then(grouped => { if (!cancelled) { setEntries(grouped); setLoading(false); } })
      .catch(err => {
        if (!cancelled) {
          showToast("Error al cargar: " + (err.message || "desconocido"));
          setEntries({});
          setLoading(false);
        }
      });
    return () => { cancelled = true; };
  }, [key]);

  const formTotal = num(efectivoVal) + num(tarjetaVal) + num(otroVal);

  function resetForm(){
    setEfectivoVal("");
    setTarjetaVal("");
    setOtroVal("");
    setIvaRate('none');
    setScanNote(null);
  }

  async function saveEntry(e){
    e.preventDefault();
    if (!dateVal || (efectivoVal === "" && tarjetaVal === "" && otroVal === "")) return;
    setSaving(true);
    try {
      const totalTicket = num(efectivoVal) + num(tarjetaVal) + num(otroVal);
      const base4 = ivaRate === '4' ? Number((totalTicket / 1.04).toFixed(2)) : null;
      const base10 = ivaRate === '10' ? Number((totalTicket / 1.10).toFixed(2)) : null;
      const base21 = ivaRate === '21' ? Number((totalTicket / 1.21).toFixed(2)) : null;
      const payload = {
        fecha: dateVal,
        efectivo: num(efectivoVal),
        tarjeta: num(tarjetaVal),
        otro: num(otroVal),
        base4,
        base10,
        base21,
      };

      const { data, error } = await sb.from('tickets').insert({ ...payload, record_type: 'alta' }).select().single();
      if (error) throw error;
      const [y, m, d] = dateVal.split("-");
      const mkey = `${y}-${m}`;
      const newTicket = { id: data.id, seq: data.seq_num, efectivo: payload.efectivo, tarjeta: payload.tarjeta, otro: payload.otro, base4: payload.base4, base10: payload.base10, base21: payload.base21 };
      if (mkey === key) {
        setEntries(prev => {
          const updated = { ...(prev || {}) };
          updated[d] = [...(updated[d] || []), newTicket];
          return updated;
        });
        showToast((entries && entries[d] ? entries[d].length + 1 : 1) > 1 ? "Ticket añadido" : "Guardado");
      } else {
        setCursor(new Date(Number(y), Number(m) - 1, 1));
        showToast("Guardado");
      }
      resetForm();
    } catch (err) {
      showToast("Error al guardar: " + (err.message || "desconocido"));
    } finally {
      setSaving(false);
    }
  }

  async function deleteTicket(day, id){
    if (!window.confirm("¿Anular este ticket? No se borra: queda registrado como anulado, con historial completo, tal como exige la ley.")) return;
    try {
      const { error } = await sb.from('tickets').insert({
        fecha: `${key}-${day}`, efectivo: 0, tarjeta: 0, otro: 0, base4: null, base10: null, base21: null,
        record_type: 'anulacion', refs_id: id,
      });
      if (error) throw error;
      setEntries(prev => {
        const updated = { ...prev };
        const filtered = (updated[day] || []).filter(t => t.id !== id);
        if (filtered.length) updated[day] = filtered; else delete updated[day];
        return updated;
      });
    } catch (err) {
      showToast("Error al anular: " + (err.message || ""));
    }
  }

  function changeMonth(delta){
    const next = new Date(cursor.getFullYear(), cursor.getMonth() + delta, 1);
    setCursor(next);
  }

  const sortedDays = useMemo(() => {
    if (!entries) return [];
    return Object.keys(entries).sort((a,b) => Number(b) - Number(a));
  }, [entries]);

  const totals = useMemo(() => {
    if (!entries) return { total: 0, efectivo: 0, tarjeta: 0, otro: 0, base4: 0, base10: 0, base21: 0 };
    return Object.values(entries).reduce((acc, tickets) => {
      const s = sumTickets(tickets);
      acc.efectivo += s.efectivo;
      acc.tarjeta += s.tarjeta;
      acc.otro += s.otro;
      acc.base4 += s.base4;
      acc.base10 += s.base10;
      acc.base21 += s.base21;
      return acc;
    }, { efectivo: 0, tarjeta: 0, otro: 0, base4: 0, base10: 0, base21: 0 });
  }, [entries]);
  totals.total = totals.efectivo + totals.tarjeta + totals.otro;

  const numDays = sortedDays.length;
  const avg = numDays ? totals.total / numDays : 0;

  function buildQuarterWorkbook(qkey, rowsByDate, meta){
    if (typeof XLSX === 'undefined') {
      throw new Error('No se pudo cargar la librería de Excel (revisa tu conexión a internet y recarga la página).');
    }
    meta = meta || {};
    const dates = Object.keys(rowsByDate).sort();
    if (!dates.length) return null;
    const headerCols = ["Nº registro","Fecha","Día","Ticket #","Efectivo (€)","Tarjeta (€)","Otros (€)","Total (€)","Base IVA 4% (€)","Cuota IVA 4% (€)","Base IVA 10% (€)","Cuota IVA 10% (€)","Base IVA 21% (€)","Cuota IVA 21% (€)"];
    const aoa = [];
    if ((meta.businessName && meta.businessName.trim()) || (meta.cif && meta.cif.trim())) {
      aoa.push([meta.businessName && meta.businessName.trim() ? `Comercio: ${meta.businessName.trim()}` : ""]);
      aoa.push([meta.cif && meta.cif.trim() ? `CIF: ${meta.cif.trim()}` : ""]);
      aoa.push([]);
    }
    aoa.push(headerCols);
    let t_efectivo = 0, t_tarjeta = 0, t_otro = 0, t_base4 = 0, t_base10 = 0, t_base21 = 0, t_cuota4 = 0, t_cuota10 = 0, t_cuota21 = 0;
    dates.forEach(dateStr => {
      const tickets = rowsByDate[dateStr];
      const [dy, dm, dd] = dateStr.split("-");
      const dateObj = new Date(Number(dy), Number(dm)-1, Number(dd));
      tickets.forEach((t, i) => {
        const tot = Number(t.efectivo||0) + Number(t.tarjeta||0) + Number(t.otro||0);
        const cuota4 = t.base4 ? Number((Number(t.base4) * 0.04).toFixed(2)) : null;
        const cuota10 = t.base10 ? Number((Number(t.base10) * 0.10).toFixed(2)) : null;
        const cuota21 = t.base21 ? Number((Number(t.base21) * 0.21).toFixed(2)) : null;
        t_efectivo += Number(t.efectivo||0);
        t_tarjeta += Number(t.tarjeta||0);
        t_otro += Number(t.otro||0);
        t_base4 += Number(t.base4||0);
        t_base10 += Number(t.base10||0);
        t_base21 += Number(t.base21||0);
        t_cuota4 += cuota4 || 0;
        t_cuota10 += cuota10 || 0;
        t_cuota21 += cuota21 || 0;
        aoa.push([
          t.seq,
          `${dd}/${dm}/${dy}`,
          DIAS[dateObj.getDay()],
          i + 1,
          Number(t.efectivo || 0),
          Number(t.tarjeta || 0),
          Number(t.otro || 0),
          Number(tot.toFixed(2)),
          t.base4 === null || t.base4 === undefined ? "" : Number(t.base4),
          cuota4 === null ? "" : cuota4,
          t.base10 === null || t.base10 === undefined ? "" : Number(t.base10),
          cuota10 === null ? "" : cuota10,
          t.base21 === null || t.base21 === undefined ? "" : Number(t.base21),
          cuota21 === null ? "" : cuota21,
        ]);
      });
    });
    aoa.push([
      "", "", "", "TOTAL",
      Number(t_efectivo.toFixed(2)),
      Number(t_tarjeta.toFixed(2)),
      Number(t_otro.toFixed(2)),
      Number((t_efectivo + t_tarjeta + t_otro).toFixed(2)),
      Number(t_base4.toFixed(2)),
      Number(t_cuota4.toFixed(2)),
      Number(t_base10.toFixed(2)),
      Number(t_cuota10.toFixed(2)),
      Number(t_base21.toFixed(2)),
      Number(t_cuota21.toFixed(2)),
    ]);
    const ws = XLSX.utils.aoa_to_sheet(aoa);
    ws['!cols'] = [{wch:11},{wch:12},{wch:7},{wch:9},{wch:13},{wch:13},{wch:11},{wch:12},{wch:15},{wch:15},{wch:16},{wch:16},{wch:16},{wch:16}];
    const wb = XLSX.utils.book_new();
    const sheetName = qkey.replace("-", " ");
    XLSX.utils.book_append_sheet(wb, ws, sheetName);

    const voided = meta.voided || [];
    if (voided.length) {
      const vAoa = [["Nº registro","Fecha del ticket","Importe (€)","Fecha de anulación"]];
      voided.forEach(v => {
        const [vy, vm, vd] = String(v.fecha).slice(0,10).split("-");
        const [ay, am, ad] = String(v.fechaAnulacion).slice(0,10).split("-");
        vAoa.push([v.seq, `${vd}/${vm}/${vy}`, v.total, `${ad}/${am}/${ay}`]);
      });
      const wsV = XLSX.utils.aoa_to_sheet(vAoa);
      wsV['!cols'] = [{wch:11},{wch:16},{wch:12},{wch:18}];
      XLSX.utils.book_append_sheet(wb, wsV, "Anulados");
    }
    return wb;
  }

  function buildExcelForQuarter(qkey, rowsByDate, meta){
    const wb = buildQuarterWorkbook(qkey, rowsByDate, meta);
    if (!wb) return false;
    const filename = `resumen_ventas_${qkey}.xlsx`;
    try {
      XLSX.writeFile(wb, filename);
    } catch (err1) {
      const wbout = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
      const blob = new Blob([wbout], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 2000);
    }
    return true;
  }

  async function isExported(qkey){
    const { data, error } = await sb.from('exported_months').select('month_key').eq('month_key', qkey).maybeSingle();
    if (error) return false;
    return !!data;
  }
  async function markExported(qkey){
    try { await sb.from('exported_months').insert({ month_key: qkey }); } catch (e) { /* ya existía, ignorar */ }
  }

  async function exportQuarter(){
    setExporting(true);
    try {
      const qkey = quarterKeyFromDate(cursor);
      const { first, last } = quarterInfo(qkey);
      const { rowsByDate, voided } = await fetchRange(first, last);
      const ok = buildExcelForQuarter(qkey, rowsByDate, { businessName, cif, voided });
      if (ok) {
        await markExported(qkey);
        showToast("Excel del trimestre generado");
        checkAccess();
      } else {
        showToast("No hay tickets en ese trimestre.");
      }
    } catch (err) {
      showToast("Error: " + (err && err.message ? err.message : "desconocido"));
    } finally {
      setExporting(false);
    }
  }

  async function sendQuarterByEmail(){
    if (!gestoriaEmail.trim()) return;
    setSendingEmail(true);
    try {
      const qkey = quarterKeyFromDate(cursor);
      const { first, last, label } = quarterInfo(qkey);
      const { rowsByDate, voided } = await fetchRange(first, last);
      const wb = buildQuarterWorkbook(qkey, rowsByDate, { businessName, cif, voided });
      if (!wb) {
        showToast("No hay tickets en ese trimestre.");
        return;
      }
      const base64 = XLSX.write(wb, { bookType: 'xlsx', type: 'base64' });
      const { data, error } = await sb.functions.invoke('clever-responder', {
        body: {
          to: gestoriaEmail.trim(),
          subject: `Resumen de ventas ${qkey.replace('-', ' ')}`,
          text: `Hola,\n\nAdjunto el resumen de ventas del trimestre ${label}.\n\nUn saludo.`,
          filename: `resumen_ventas_${qkey}.xlsx`,
          contentBase64: base64,
        },
      });
      if (error) throw error;
      if (data && data.error) throw new Error(typeof data.error === 'string' ? data.error : JSON.stringify(data.error));
      await markExported(qkey);
      showToast("Email enviado a tu gestoría");
      checkAccess();
    } catch (err) {
      showToast("Error al enviar: " + (err && err.message ? err.message : "desconocido"));
    } finally {
      setSendingEmail(false);
    }
  }

  // Al iniciar sesión: si el trimestre anterior tiene tickets sin exportar todavía,
  // genera y descarga su Excel automáticamente (una sola vez por trimestre).
  useEffect(() => {
    (async () => {
      try {
        const today = new Date();
        const currentQ = Math.floor(today.getMonth() / 3);
        const prevQStartMonth = currentQ === 0 ? 9 : (currentQ - 1) * 3; // si estamos en Q1, el trimestre anterior es Q4 del año pasado
        const prevQYear = currentQ === 0 ? today.getFullYear() - 1 : today.getFullYear();
        const prevDate = new Date(prevQYear, prevQStartMonth, 1);
        const prevQkey = quarterKeyFromDate(prevDate);
        const already = await isExported(prevQkey);
        if (already) return;
        const { first, last } = quarterInfo(prevQkey);
        const { rowsByDate, voided } = await fetchRange(first, last);
        if (!Object.keys(rowsByDate).length) return;
        const ok = buildExcelForQuarter(prevQkey, rowsByDate, { businessName: businessNameRef.current, cif: cifRef.current, voided });
        if (ok) {
          await markExported(prevQkey);
          showToast(`Resumen de ${prevQkey.replace("-", " ")} descargado automáticamente`);
          checkAccess();
        }
      } catch (err) {
        // no interrumpir el uso normal de la app si esto falla
      }
    })();
  }, []);

function preprocessForOCR(file){
  return new Promise((resolve) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      try {
        // Ajusta al tamaño ideal para OCR sin pasarse: agranda fotos pequeñas,
        // pero SIEMPRE limita el lado largo a un máximo seguro para el navegador móvil
        // (fotos de cámara a tamaño completo pueden hacer fallar el canvas si se agrandan más).
        const longSide = Math.max(img.width, img.height);
        const maxDim = 1800;
        let scale = maxDim / longSide;
        if (scale > 2) scale = 2; // no hace falta agrandar más de x2 aunque la foto sea diminuta
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const d = imageData.data;
        // escala de grises + auto-contraste (estira el rango de tonos)
        let min = 255, max = 0;
        const gray = new Uint8ClampedArray(d.length / 4);
        for (let i = 0; i < d.length; i += 4) {
          const g = 0.299*d[i] + 0.587*d[i+1] + 0.114*d[i+2];
          const idx = i / 4;
          gray[idx] = g;
          if (g < min) min = g;
          if (g > max) max = g;
        }
        const range = Math.max(1, max - min);
        // umbral simple sobre el contraste ya estirado (ayuda con tickets de matriz de puntos / bajo contraste)
        const threshold = 0.55; // proporción dentro del rango estirado
        for (let i = 0; i < d.length; i += 4) {
          const idx = i / 4;
          const stretched = (gray[idx] - min) / range; // 0..1
          const v = stretched > threshold ? 255 : 0;
          d[i] = d[i+1] = d[i+2] = v;
        }
        ctx.putImageData(imageData, 0, 0);
        canvas.toBlob((blob) => {
          URL.revokeObjectURL(url);
          resolve(blob || file);
        }, 'image/png');
      } catch (err) {
        URL.revokeObjectURL(url);
        resolve(file); // si algo falla, usamos la imagen original sin procesar
      }
    };
    img.onerror = () => { URL.revokeObjectURL(url); resolve(file); };
    img.src = url;
  });
}

  function handleScan(e){
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!file) return;
    setScanning(true);
    setScanNote(null);
    preprocessForOCR(file).then(processedFile => Tesseract.recognize(processedFile, 'spa'))
      .then(({ data }) => {
        const f = extractFields(data.text);
        let filled = [];
        if (f.efectivo !== null) { setEfectivoVal(f.efectivo.toFixed(2)); filled.push('efectivo'); }
        if (f.tarjeta !== null) { setTarjetaVal(f.tarjeta.toFixed(2)); filled.push('tarjeta'); }
        if (f.otro !== null) { setOtroVal(f.otro.toFixed(2)); filled.push('otros'); }
        const detected = [f.base4 !== null, f.base10 !== null, f.base21 !== null].filter(Boolean).length;
        if (detected === 1) {
          if (f.base4 !== null) { setIvaRate('4'); setShowIva(true); }
          else if (f.base10 !== null) { setIvaRate('10'); setShowIva(true); }
          else if (f.base21 !== null) { setIvaRate('21'); setShowIva(true); }
        }
        if (!filled.length && f.total !== null) {
          setEfectivoVal(f.total.toFixed(2));
          filled.push('total (ajusta efectivo/tarjeta si hace falta)');
        }
        if (filled.length) {
          setScanNote(`Borrador: ${filled.join(', ')} — toca los campos para ajustar.`);
        } else {
          setScanNote("Esta vez no he pillado los números — escríbelos tú, tarda igual de poco.");
        }
      })
      .catch(() => setScanNote("No he podido procesar la foto — inténtalo otra vez o escribe los datos a mano."))
      .finally(() => setScanning(false));
  }

  if (access === 'locked') {
    return <Paywall session={session} onRecheck={checkAccess} checking={accessChecking} />;
  }

  return (
    <div className="app-shell">
      <div className="top-row">
        <p className="eyebrow" style={{margin:0}}>Registro diario</p>
        <button type="button" className="logout-link" onClick={() => sb.auth.signOut()} title="Cerrar sesión">
          {(session.user.user_metadata && session.user.user_metadata.nombre) || session.user.email} · salir
        </button>
      </div>
      <h1>Ventas del día</h1>

      <div className="month-nav">
        <button onClick={() => changeMonth(-1)} aria-label="Mes anterior">‹</button>
        <div className="month-label">{MESES[cursor.getMonth()]} {cursor.getFullYear()}</div>
        <button onClick={() => changeMonth(1)} aria-label="Mes siguiente">›</button>
      </div>

      <div className="summary-card">
        <div className="summary-total-label">Total del mes</div>
        <div className="summary-total">{loading ? "…" : fmtEUR(totals.total)}</div>
        <div className="summary-row">
          <span>Efectivo: <b>{loading ? "-" : fmtEUR(totals.efectivo)}</b></span>
          <span>Tarjeta: <b>{loading ? "-" : fmtEUR(totals.tarjeta)}</b></span>
          {totals.otro > 0 && <span>Otros: <b>{fmtEUR(totals.otro)}</b></span>}
        </div>
        <div className="summary-row" style={{marginTop:6}}>
          <span>Días: <b>{loading ? "-" : numDays}</b></span>
          <span>Media/día: <b>{loading ? "-" : fmtEUR(avg)}</b></span>
        </div>
      </div>

      <button type="button" className="btn-scan" onClick={() => fileInputRef.current && fileInputRef.current.click()} disabled={scanning}>
        {scanning ? "Leyendo el ticket…" : "📷 Escanear ticket"}
      </button>
      <input ref={fileInputRef} type="file" accept="image/*" capture="environment"
             style={{display:"none"}} onChange={handleScan} />
      {scanNote && <p className="scan-note">{scanNote}</p>}

      <form className="entry-form" onSubmit={saveEntry}>
        <div className="form-row">
          <div className="field">
            <label htmlFor="f-date">Fecha</label>
            <input id="f-date" type="date" value={dateVal} max={todayISO()}
                   onChange={e => setDateVal(e.target.value)} required />
          </div>
        </div>
        {(() => {
          const [dy, dm, dd] = dateVal.split("-");
          if (`${dy}-${dm}` !== key || !entries) return null;
          const tickets = entries[dd] || [];
          if (!tickets.length) return null;
          const s = sumTickets(tickets);
          return (
            <p className="scan-note" style={{color:"var(--text-lo)"}}>
              Ya llevas {tickets.length} ticket{tickets.length>1?'s':''} ese día · acumulado {fmtEUR(s.efectivo+s.tarjeta+s.otro)}
            </p>
          );
        })()}

        <div className="form-row">
          <div className="field">
            <label htmlFor="f-efectivo">Efectivo (€)</label>
            <input id="f-efectivo" type="text" inputMode="decimal" placeholder="0,00"
                   value={efectivoVal} onChange={e => setEfectivoVal(e.target.value)} />
          </div>
          <div className="field">
            <label htmlFor="f-tarjeta">Tarjeta (€)</label>
            <input id="f-tarjeta" type="text" inputMode="decimal" placeholder="0,00"
                   value={tarjetaVal} onChange={e => setTarjetaVal(e.target.value)} />
          </div>
          <div className="field">
            <label htmlFor="f-otro">Otros (Bizum, vales…)</label>
            <input id="f-otro" type="text" inputMode="decimal" placeholder="0,00"
                   value={otroVal} onChange={e => setOtroVal(e.target.value)} />
          </div>
        </div>

        <div className="form-total">
          <span>Total de este ticket</span>
          <span>{fmtEUR(formTotal)}</span>
        </div>

        <button type="button" className="iva-toggle" onClick={() => setShowIva(s => !s)}>
          {showIva ? "− Ocultar IVA" : "+ Indicar tipo de IVA (opcional)"}
        </button>

        {showIva && (
          <div className="iva-btn-row">
            <button type="button"
                    className={"iva-btn" + (ivaRate === 'none' ? " active" : "")}
                    onClick={() => setIvaRate('none')}>
              Sin IVA
            </button>
            <button type="button"
                    className={"iva-btn" + (ivaRate === '4' ? " active" : "")}
                    onClick={() => setIvaRate('4')}>
              IVA 4%
            </button>
            <button type="button"
                    className={"iva-btn" + (ivaRate === '10' ? " active" : "")}
                    onClick={() => setIvaRate('10')}>
              IVA 10%
            </button>
            <button type="button"
                    className={"iva-btn" + (ivaRate === '21' ? " active" : "")}
                    onClick={() => setIvaRate('21')}>
              IVA 21%
            </button>
          </div>
        )}
        {showIva && ivaRate !== 'none' && formTotal > 0 && (
          <p className="scan-note" style={{marginTop:"-4px"}}>
            Base sin IVA: {fmtEUR(formTotal / (ivaRate === '4' ? 1.04 : ivaRate === '10' ? 1.10 : 1.21))} (calculada del total del ticket)
          </p>
        )}

        <button className="btn-save" type="submit" disabled={saving}>
          {saving ? "..." : "+ Añadir ticket"}
        </button>
      </form>

      <p className="section-label">Este mes · ticket a ticket</p>

      {loading ? (
        <div className="empty-state">Cargando…</div>
      ) : sortedDays.length === 0 ? (
        <div className="empty-state">Todavía no hay ventas registradas este mes.</div>
      ) : (
        sortedDays.map(day => {
          const [y, m] = key.split("-");
          const dateObj = new Date(Number(y), Number(m)-1, Number(day));
          const tickets = entries[day] || [];
          return tickets.map((t, i) => {
            const tot = Number(t.efectivo||0) + Number(t.tarjeta||0) + Number(t.otro||0);
            return (
              <div className="ticket" key={t.id}>
                <div className="ticket-top">
                  <div>
                    <div className="ticket-date">{day}/{m}/{y} <span style={{color:"var(--text-lo)", fontWeight:400}}>#{t.seq}</span></div>
                    <div className="ticket-weekday">
                      {DIAS[dateObj.getDay()]}{tickets.length > 1 ? ` · ticket ${i+1}/${tickets.length}` : ""}
                    </div>
                  </div>
                  <div style={{display:"flex", alignItems:"center"}}>
                    <div className="ticket-amount">{fmtEUR(tot)}</div>
                    <button className="ticket-del" onClick={() => deleteTicket(day, t.id)} aria-label="Anular">✕</button>
                  </div>
                </div>
                <div className="ticket-sub">
                  <span>Efvo {fmtEUR(t.efectivo||0)}</span>
                  <span>Tarj {fmtEUR(t.tarjeta||0)}</span>
                  {t.otro > 0 && <span>Otros {fmtEUR(t.otro)}</span>}
                  {t.base4 ? <span>IVA 4%</span> : null}
                  {t.base10 ? <span>IVA 10%</span> : null}
                  {t.base21 ? <span>IVA 21%</span> : null}
                </div>
              </div>
            );
          });
        })
      )}

      <div className="gestoria-box">
        <label htmlFor="f-business-name" className="gestoria-label">Nombre del comercio</label>
        <input id="f-business-name" type="text" placeholder="Ej: Bar Restaurante Calpe S.L."
               value={businessName}
               onChange={e => { setBusinessName(e.target.value); setGestoriaSaved(false); }}
               onBlur={() => { if (!gestoriaSaved) saveGestoriaEmail(); }} />

        <label htmlFor="f-cif" className="gestoria-label" style={{marginTop:"12px"}}>CIF</label>
        <input id="f-cif" type="text" placeholder="B12345678"
               value={cif}
               onChange={e => { setCif(e.target.value); setGestoriaSaved(false); }}
               onBlur={() => { if (!gestoriaSaved) saveGestoriaEmail(); }} />
        <p style={{fontSize:"11px", color:"var(--text-lo)", margin:"6px 0 12px"}}>
          Aparecerán en la cabecera del Excel que recibe tu gestoría.
        </p>

        <label htmlFor="f-gestoria" className="gestoria-label">Email de tu gestoría</label>
        <input id="f-gestoria" type="email" placeholder="gestoria@ejemplo.com"
               value={gestoriaEmail}
               onChange={e => { setGestoriaEmail(e.target.value); setGestoriaSaved(false); }}
               onBlur={() => { if (!gestoriaSaved) saveGestoriaEmail(); }} />
        {gestoriaEmail.trim() && (
          <button type="button" className="mailto-btn" style={{width:"100%", cursor:"pointer", marginBottom:"8px"}}
                  onClick={sendQuarterByEmail} disabled={sendingEmail}>
            {sendingEmail ? "Enviando…" : "🚀 Enviar ahora (automático, con Excel adjunto)"}
          </button>
        )}
        {gestoriaEmail.trim() && (
          <a className="mailto-btn" style={{opacity:0.75}}
             href={`mailto:${gestoriaEmail.trim()}?subject=${encodeURIComponent('Resumen de ventas ' + quarterKeyFromDate(cursor).replace('-', ' '))}&body=${encodeURIComponent('Hola,\n\nAdjunto el resumen de ventas del trimestre ' + quarterInfo(quarterKeyFromDate(cursor)).label + '.\n\nUn saludo.')}`}>
            📧 O ábrelo tú en tu correo (adjuntas tú)
          </a>
        )}

        <label htmlFor="f-gestoria-tel" className="gestoria-label" style={{marginTop:"12px"}}>WhatsApp de tu gestoría</label>
        <input id="f-gestoria-tel" type="tel" placeholder="+34 600 000 000"
               value={gestoriaPhone}
               onChange={e => { setGestoriaPhone(e.target.value); setGestoriaSaved(false); }}
               onBlur={() => { if (!gestoriaSaved) saveGestoriaEmail(); }} />
        {gestoriaPhone.trim() && (
          <a className="whatsapp-btn"
             href={`https://wa.me/${gestoriaPhone.replace(/[^\d]/g, '')}?text=${encodeURIComponent('Hola, te mando el resumen de ventas del trimestre ' + quarterInfo(quarterKeyFromDate(cursor)).label + '. Lo adjunto ahora mismo.')}`}
             target="_blank" rel="noopener noreferrer">
            📱 Enviar por WhatsApp
          </a>
        )}
        <p style={{fontSize:"11px", color:"var(--text-lo)", margin:"8px 0 0"}}>
          El botón de arriba manda el email con el Excel adjunto automáticamente. El de WhatsApp abre el chat con el mensaje listo, pero el archivo lo adjuntas tú desde tus descargas.
        </p>
      </div>

      <p style={{textAlign:"center", fontSize:"10px", color:"var(--text-lo)", fontFamily:"'JetBrains Mono', monospace", margin:"18px 0 90px"}}>
        v-cloud.12
      </p>

      <div className="export-bar">
        <button className="btn-export" onClick={exportQuarter} disabled={exporting}>
          {exporting ? "Generando…" : `Exportar ${quarterKeyFromDate(cursor).replace("-", " ")} (${quarterInfo(quarterKeyFromDate(cursor)).label}) a Excel`}
        </button>
      </div>

      {toast && <div className="toast">{toast}</div>}
    </div>
  );
}

// --- Root: decides Auth vs App based on session -----------------------------
// --- Se muestra cuando el usuario llega desde un enlace de recuperación de contraseña
function SetNewPassword({ onDone }){
  const [password, setPassword] = useState('');
  const [showPass, setShowPass] = useState(false);
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState(null);

  async function submit(e){
    e.preventDefault();
    setBusy(true); setErr(null);
    try {
      const { error } = await sb.auth.updateUser({ password });
      if (error) throw error;
      onDone();
    } catch (e2) {
      setErr(e2.message || 'Error');
    } finally {
      setBusy(false);
    }
  }

  return (
    <div className="app-shell">
      <p className="eyebrow">Registro diario</p>
      <h1>Elige tu nueva contraseña</h1>
      <form className="entry-form" onSubmit={submit}>
        <div className="form-row">
          <div className="field">
            <label htmlFor="np-pass">Nueva contraseña</label>
            <div className="pass-wrap">
              <input id="np-pass" type={showPass ? "text" : "password"} value={password} required minLength={6}
                     onChange={e => setPassword(e.target.value)} />
              <button type="button" className="pass-toggle" onClick={() => setShowPass(s => !s)}>
                {showPass ? "OCULTAR" : "MOSTRAR"}
              </button>
            </div>
          </div>
        </div>
        {err && <p className="auth-error">{err}</p>}
        <button className="btn-save" type="submit" disabled={busy}>
          {busy ? "..." : "Guardar contraseña"}
        </button>
      </form>
    </div>
  );
}

function Root(){
  const [session, setSession] = useState(undefined); // undefined = comprobando, null = sin sesión
  const [recovery, setRecovery] = useState(false);

  useEffect(() => {
    sb.auth.getSession().then(({ data }) => setSession(data.session));
    const { data: listener } = sb.auth.onAuthStateChange((event, sess) => {
      if (event === 'PASSWORD_RECOVERY') setRecovery(true);
      setSession(sess);
    });
    return () => { listener && listener.subscription && listener.subscription.unsubscribe(); };
  }, []);

  if (session === undefined) {
    return <div className="app-shell"><div className="empty-state">Cargando…</div></div>;
  }
  if (recovery) {
    return <SetNewPassword onDone={() => setRecovery(false)} />;
  }
  if (!session) return <Auth />;
  return <App session={session} key={session.user.id} />;
}

ReactDOM.createRoot(document.getElementById('app-root')).render(<Root />);
</script>
</body>
